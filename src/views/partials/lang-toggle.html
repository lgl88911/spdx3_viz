<!-- Language switch: two segments, the active one highlighted. Used both in the
     app header and as a floating control on the landing screen (which has no
     header yet). -->
<div
  class="inline-flex items-center rounded-lg bg-slate-700/60 p-0.5 text-xs shrink-0"
  role="group"
  aria-label="Language"
>
  <template x-for="opt in localeOptions" :key="'lang-' + opt.code">
    <button
      type="button"
      class="px-2 py-1 rounded-md font-medium transition-colors"
      :class="locale === opt.code
        ? 'bg-slate-600 text-white'
        : 'text-slate-400 hover:text-slate-200'"
      :aria-pressed="locale === opt.code"
      x-text="opt.label"
      @click="setLocale(opt.code)"
    ></button>
  </template>
</div>
